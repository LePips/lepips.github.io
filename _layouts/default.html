<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  {% if site.google_analytics and jekyll.environment == 'production' %}
  {% include analytics.html %}
  {% endif %}
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>">
  <style>:root{color-scheme:light dark}*{box-sizing:border-box}html,body{background:#fff}body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;color:#1d1d1f;min-height:100vh;-webkit-text-size-adjust:100%}a{color:#06c;text-decoration:none}a:hover,a:focus{color:#004a99}.container{max-width:42rem;padding:2.625rem 1.5rem 0;margin:auto}.masthead{padding:0 0 1rem;margin-bottom:1.6rem}.masthead-title{display:flex;align-items:center;justify-content:space-between;gap:.85rem;flex-wrap:wrap;font-size:1.5rem;font-weight:600;line-height:1.2}.icon-row{display:flex;gap:12px;align-items:center}.icon-row a{display:inline-flex;color:#1d1d1f}.icon-row a:hover,.icon-row a:focus{color:#1d1d1f;opacity:.75}.icon-row svg{width:1.5rem;height:1.5rem;fill:currentColor}h2{font-size:1rem;line-height:1.4;font-weight:600;margin:1.55rem 0 .45rem}p{margin:0 0 1rem}ul{margin:0 0 1rem;padding-left:1.5rem}li{margin-bottom:.15rem}@media(prefers-color-scheme:dark){html,body{background:#1f1f21}body{color:#e8e8ea}a{color:#8dc3ff}a:hover,a:focus{color:#a6d3ff}.icon-row a,.icon-row a:hover,.icon-row a:focus{color:#e8e8ea}}</style>
</head>

</body>
</html>
